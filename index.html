<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFC Compliance Approval</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,sans-serif;background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:white;border-radius:12px;overflow:hidden;max-width:480px;width:90%;box-shadow:0 4px 24px rgba(0,0,0,.12)}
  .header{background:#1a3a5c;padding:24px;text-align:center}
  .header h1{color:white;font-size:18px;margin:0}
  .header p{color:#aac4e0;font-size:13px;margin-top:4px}
  .body{padding:32px;text-align:center}
  .icon{font-size:56px;margin-bottom:16px}
  .title{font-size:20px;font-weight:bold;margin-bottom:8px;color:#1a3a5c}
  .subtitle{color:#666;font-size:14px;margin-bottom:20px;line-height:1.5}
  .filename{background:#f8f9fb;border:1px solid #ddd;border-radius:6px;padding:10px 16px;font-size:12px;color:#333;word-break:break-all;text-align:left}
  .date{color:#999;font-size:12px;margin-top:12px}
  .spinner{border:3px solid #eee;border-top:3px solid #1a3a5c;border-radius:50%;width:36px;height:36px;animation:spin .8s linear infinite;margin:0 auto 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .footer{background:#1a3a5c;padding:12px;text-align:center}
  .footer p{color:#aac4e0;font-size:11px}
  .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:bold;margin-top:8px}
  .badge-approved{background:#e8f5e9;color:#2e7d32}
  .badge-rejected{background:#ffebee;color:#c62828}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>IFC Compliance Pipeline</h1>
    <p>REDS10 Digital Innovation</p>
  </div>
  <div class="body">
    <div id="icon" class="icon hidden"></div>
    <div class="spinner" id="spinner"></div>
    <div class="title" id="title">Processing...</div>
    <div class="subtitle" id="subtitle">Please wait while we record your decision.</div>
    <div class="filename" id="filename" style="display:none"></div>
    <div class="date" id="date"></div>
  </div>
  <div class="footer"><p>IFC Compliance Pipeline &middot; REDS10 Digital Innovation</p></div>
</div>

<script>
  const APPROVE_WEBHOOK = 'https://webhooks.eu.workato.com/webhooks/rest/ba15636d-84ce-43f3-a362-84737ccf041b/ifc-compliance-approval-handle';
  const REJECT_WEBHOOK  = 'https://webhooks.eu.workato.com/webhooks/rest/ba15636d-84ce-43f3-a362-84737ccf041b/ifc-compliance-selection-reject';

  function show(icon, title, subtitle, badgeClass, badgeText, filename) {
    document.getElementById('spinner').style.display = 'none';
    var ic = document.getElementById('icon');
    ic.textContent = icon; ic.classList.remove('hidden');
    document.getElementById('title').textContent = title;
    document.getElementById('subtitle').innerHTML = subtitle;
    if (filename) {
      var fn = document.getElementById('filename');
      fn.textContent = filename; fn.style.display = 'block';
    }
    if (badgeClass) {
      var b = document.createElement('div');
      b.className = 'badge ' + badgeClass; b.textContent = badgeText;
      document.getElementById('date').appendChild(b);
    }
    document.getElementById('date').innerHTML += '<br>' + new Date().toLocaleString('en-GB', {dateStyle:'long',timeStyle:'short'}) + ' UTC';
  }

  (async function() {
    var params = new URLSearchParams(window.location.search);
    var action            = params.get('action')            || '';
    var itemId            = params.get('itemId')            || '';
    var fileName          = params.get('fileName')          || '';
    var projectId         = params.get('projectId')         || '';
    var approvedFolderUrn = params.get('approvedFolderUrn') || '';
    var approvedBy        = params.get('approvedBy')        || 'BIM Team';
    var uploaderName      = params.get('uploaderName')      || '';
    var uploaderEmail     = params.get('uploaderEmail')     || '';
    var docNumber         = params.get('docNumber')         || '';
    var discipline        = params.get('discipline')        || '';
    var projectName       = params.get('projectName')       || '';
    var passVal           = params.get('passVal')           || '0';
    var failVal           = params.get('failVal')           || '0';
    var totalVal          = params.get('totalVal')          || '0';
    var pctVal            = params.get('pctVal')            || '0';

    if (!action || !itemId || !projectId) {
      show('\u26a0\ufe0f','Invalid Link','This approval link is missing required parameters.<br>Please use the link from your compliance email.', null, null, null);
      return;
    }

    var webhookUrl = action === 'approve' ? APPROVE_WEBHOOK : REJECT_WEBHOOK;
    var payload = {
      action:           action,
      itemId:           itemId,
      fileName:         fileName,
      projectId:        projectId,
      approvedFolderUrn: approvedFolderUrn,
      approvedBy:       approvedBy,
      uploaderName:     uploaderName,
      uploaderEmail:    uploaderEmail,
      docNumber:        docNumber,
      discipline:       discipline,
      projectName:      projectName,
      passVal:          passVal,
      failVal:          failVal,
      totalVal:         totalVal,
      pctVal:           pctVal
    };

    try {
      var resp = await fetch(webhookUrl, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });

      if (resp.ok) {
        if (action === 'approve') {
          show('\u2705','Report Approved',
            'The compliance report has been approved and will be copied to the <strong>IFC Approved Reports</strong> folder in ACC.<br><br>The submitter will be notified by transmittal.',
            'badge-approved', 'APPROVED', fileName);
        } else {
          show('\u274c','Report Rejected',
            'The compliance report has been rejected. The submitter will be notified and asked to review and re-upload the IFC model.',
            'badge-rejected', 'REJECTED', fileName);
        }
      } else {
        show('\u26a0\ufe0f','Request Failed',
          'The webhook returned status ' + resp.status + '.<br>Please contact the BIM Team.', null, null, fileName);
      }
    } catch(err) {
      show('\u26a0\ufe0f','Connection Error',
        'Could not reach the Workato webhook.<br>Error: ' + err.message + '<br><br>Please contact the BIM Team.',
        null, null, fileName);
    }
  })();
</script>
</body>
</html>
