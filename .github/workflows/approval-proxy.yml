name: Approval Proxy

on:
  repository_dispatch:
    types: [approve-report, reject-report]

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to ifc-compliance
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const d = context.payload.client_payload;
            const action = context.payload.action;
            core.info('Action: ' + action);
            core.info('Payload: ' + JSON.stringify(d));

            if (action === 'approve-report') {
              await github.rest.actions.createWorkflowDispatch({
                owner: 'RealAbba5',
                repo: 'ifc-compliance',
                workflow_id: 'ifc-copy-approved.yml',
                ref: 'main',
                inputs: {
                  item_id:             d.a || '',
                  report_filename:     d.b || '',
                  approved_by:         d.c || 'BIM Team',
                  project_id:          d.d || '',
                  approved_folder_urn: d.e || '',
                  uploader_name:       d.f || '',
                  uploader_email:      d.g || '',
                  discipline:          d.h || '',
                  doc_number:          d.i || '',
                  project_name:        d.j || '',
                  pass_val:            String(d.k || '0'),
                  fail_val:            String(d.l || '0'),
                  total_val:           String(d.m || '0'),
                  pct_val:             String(d.n || '0'),
                  approver_email:      d.o || '',
                  accLink:             d.p || ''
                }
              });
              core.info('Dispatched ifc-copy-approved.yml successfully');
            } else {
              core.info('Reject - no file movement needed');
            }